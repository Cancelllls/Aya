Builds:
  - versionName: 1.2.9
    versionCode: 12209
    commit: 9d1a2ab4a378cf81777915db363040b303af8a18
    output: build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/build-apk.yml
        | head -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i '/in_app_purchase/d' pubspec.yaml
      - cp pubspec.lock.fdroid pubspec.lock
      - cp lib/donation/google_play_donation_stub.dart lib/donation/google_play_donation.dart
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - cd $PUB_CACHE/hosted/pub.dev/geolocator_android-*/android
      - sed -i -e '/gms/d' build.gradle
      - cd src/main/java/com/baseflow/geolocator/location
      - rm FusedLocationClient.java
      - sed -i -e '/if (forceAndroidLocationManager) {/,/^  }/c return new LocationManagerClient(context,
        locationOptions);}' -e '/isGooglePlayServicesAvailable/,/^  }/d' -e '/gms/d'
        GeolocationManager.java
    scanignore:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor fdroid --release --split-per-abi
        --target-platform="android-arm64" --obfuscate --split-debug-info=build/debug-info

