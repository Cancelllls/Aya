AutoName: Aya
Description: |
  Aya is a comprehensive, offline-first Islamic companion app built with
  Flutter.

  * Quran — 10 Qira'at (Hafs, Warsh, Qalun, etc.) with per-ayah audio sync
    for 12 reciters. 6 tafsir editions. Continuous mushaf or ayah-by-ayah
    reading. Arabic search with full diacritic normalization.

  * Hadith — 13 collections (Bukhari, Muslim, Abu Dawud, Tirmidhi, Nasai,
    Ibn Majah, Malik, Riyad as-Salihin, and more). FTS5 full-text search.
    Grading and explanation from Dorar.net.

  * Prayer Times — 14 calculation methods, fully offline via adhan library.
    Native AlarmManager scheduling with Five Prayers-style MediaPlayer +
    MediaSession for reliable adhan playback.

  * Azkar — 11 categories (morning, evening, post-prayer, sleep, protection,
    forgiveness, 99 Names of Allah, custom). Counter tracking with haptics.

  * Qibla compass, prayer tracker with statistics, 8 home screen widgets,
    Ramadan alerts, digital tasbih, full backup/restore.

  Completely free and ad-free. No account required. Everything works offline.

RepoType: git
Repo: https://github.com/Cancelllls/Aya.git

Builds:
  - versionName: 1.1.4
    versionCode: 10104
    commit: v1.1.4
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@3.44.4
    prebuild:
      - sed -i '/in_app_purchase/d' pubspec.yaml
      - cp lib/donation/google_play_donation_stub.dart lib/donation/google_play_donation.dart
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - find .pub-cache -name "build.gradle" -path "*/geolocator_android*/*" -exec sed -i "s/implementation 'com.google.android.gms:play-services-location/compileOnly 'com.google.android.gms:play-services-location/g" {} +
    scanignore:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --flavor fdroid --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
