name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build iOS Application (No Code Signing)
        run: flutter build ios --release --no-codesign
        
      - name: Compress iOS App Payload into IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ios-release.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/iphoneos/ios-release.ipa

      - name: Upload to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="Cancelllls/Aya"
          for i in $(seq 1 20); do
            TAG=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq -r '.[0].tagName' 2>/dev/null)
            if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
              gh release upload "$TAG" build/ios/iphoneos/ios-release.ipa --repo "$REPO" --clobber
              exit 0
            fi
            echo "Waiting for APK release... ($i/20)"
            sleep 30
          done
          echo "No release found after 10 min — uploaded as artifact only"
