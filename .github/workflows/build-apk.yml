name: Build APK

on:
  workflow_dispatch:
  # push disabled during F-Droid submission to keep tags stable
  # push:
  #   branches:
  #     - main
    paths-ignore:
      - 'releases/**'

jobs:
  # ── Auto-Bump Version ────────────────────────────────────────────────
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump Patch Version
        id: bump
        run: |
          OLD_NEW=$(python3 tools/bump_version.py)
          OLD=$(echo "$OLD_NEW" | awk '{print $1}')
          NEW=$(echo "$OLD_NEW" | awk '{print $2}')
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped: $OLD → $NEW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/version.dart pubspec.yaml
          git commit -m "chore: bump version to v${NEW} [skip ci]"
          git push origin main

  # ── Google Play Build (IAP) ──────────────────────────────────────────
  google-play:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set Version
        run: |
          echo "Building Google Play APK for v${{ needs.bump.outputs.version }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Google Play APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info --dart-define=GOOGLE_PLAY=true

      - name: Rename APKs for Google Play
        run: |
          VER="${{ needs.bump.outputs.version }}"
          mkdir -p release_apks
          for arch in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-${arch}-release.apk \
               release_apks/Aya-v${VER}-googleplay-${arch}.apk
          done

      - name: Upload Google Play APKs
        uses: actions/upload-artifact@v4
        with:
          name: google-play-apks
          path: release_apks/

  # ── F-Droid / Open Source Build (PayPal only, no IAP) ────────────────
  fdroid:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set Version
        run: |
          VER="${{ needs.bump.outputs.version }}"
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/^version: .*/version: ${VER}+${VERSION_CODE}/" pubspec.yaml

      - name: Strip Google IAP for F-Droid
        run: |
          sed -i '/in_app_purchase/d' pubspec.yaml
          cp lib/donation/google_play_donation_stub.dart lib/donation/google_play_donation.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build F-Droid APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Rename APKs for F-Droid
        run: |
          VER="${{ needs.bump.outputs.version }}"
          mkdir -p release_apks
          for arch in armeabi-v7a arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-${arch}-release.apk \
               release_apks/Aya-v${VER}-fdroid-${arch}.apk
          done

      - name: Upload F-Droid APKs
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-apks
          path: release_apks/

  # ── Release ───────────────────────────────────────────────────────────
  release:
    needs: [bump, google-play, fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set Version
        id: version
        run: |
          VER="${{ needs.bump.outputs.version }}"
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          echo "display=${VER}" >> $GITHUB_OUTPUT

      - name: Download Google Play APKs
        uses: actions/download-artifact@v4
        with:
          name: google-play-apks
          path: apks/

      - name: Download F-Droid APKs
        uses: actions/download-artifact@v4
        with:
          name: fdroid-apks
          path: apks/

      - name: Generate Changelog
        id: changelog
        run: |
          CHANGELOG=$(python3 tools/gen_changelog.py "${{ steps.version.outputs.display }}")
          # Write to file to avoid GitHub output escaping issues
          echo "$CHANGELOG" > /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.display }}
          body_path: /tmp/changelog.md
          files: |
            apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
