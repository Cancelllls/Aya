name: Aya Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'releases/**'
      - '**.md'

jobs:
  # ── Google Play Build (IAP) ──────────────────────────────────────────
  google-play:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Google Play APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info --dart-define=GOOGLE_PLAY=true

      - name: Rename APKs for Google Play
        run: |
          mkdir -p release_apks
          for arch in arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-${arch}-release.apk \
               release_apks/Aya-googleplay-${arch}.apk
          done

      - name: Upload Google Play APKs
        uses: actions/upload-artifact@v6
        with:
          name: google-play-apks
          path: release_apks/

  # ── F-Droid / Open Source Build ──────────────────────────────────────
  fdroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Strip Google IAP for F-Droid
        run: |
          sed -i '/in_app_purchase/d' pubspec.yaml
          cp lib/donation/google_play_donation_stub.dart lib/donation/google_play_donation.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build F-Droid APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Rename APKs for F-Droid
        run: |
          mkdir -p release_apks
          for arch in arm64-v8a x86_64; do
            cp build/app/outputs/flutter-apk/app-${arch}-release.apk \
               release_apks/Aya-fdroid-${arch}.apk
          done

      - name: Upload F-Droid APKs
        uses: actions/upload-artifact@v6
        with:
          name: fdroid-apks
          path: release_apks/

  # ── Bump & Release (Runs ONLY on Successful Builds) ─────────────────
  release:
    needs: [google-play, fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Bump Version on Successful Build
        id: version
        run: |
          OLD_NEW=$(python3 tools/bump_version.py)
          OLD=$(echo "$OLD_NEW" | awk '{print $1}')
          NEW=$(echo "$OLD_NEW" | awk '{print $2}')
          echo "tag=v${NEW}" >> $GITHUB_OUTPUT
          echo "display=${NEW}" >> $GITHUB_OUTPUT
          echo "Bumped: $OLD → $NEW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/version.dart pubspec.yaml
          git commit -m "chore: bump version to v${NEW} [skip ci]"
          git push origin main

      - name: Download Google Play APKs
        uses: actions/download-artifact@v6
        with:
          name: google-play-apks
          path: apks/

      - name: Download F-Droid APKs
        uses: actions/download-artifact@v6
        with:
          name: fdroid-apks
          path: apks/

      - name: Rename release artifacts with new version tag
        run: |
          VER="${{ steps.version.outputs.display }}"
          cd apks
          for file in Aya-googleplay-*.apk; do
            if [ -f "$file" ]; then
              mv "$file" "${file/Aya-googleplay-/Aya-v${VER}-googleplay-}"
            fi
          done
          for file in Aya-fdroid-*.apk; do
            if [ -f "$file" ]; then
              mv "$file" "${file/Aya-fdroid-/Aya-v${VER}-fdroid-}"
            fi
          done

      - name: Generate Changelog
        id: changelog
        run: |
          CHANGELOG=$(python3 tools/gen_changelog.py "${{ steps.version.outputs.display }}")
          echo "$CHANGELOG" > /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.display }}
          body_path: /tmp/changelog.md
          files: |
            apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
