name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'releases/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Set Version
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          MAJOR=1
          MINOR=$((RUN_NUM / 100))
          PATCH=$((RUN_NUM % 100))
          VER="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$VER" >> $GITHUB_OUTPUT
          echo "display=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          # Write version.dart for app to read
          echo "const appVersion = '${MAJOR}.${MINOR}.${PATCH}';" > lib/version.dart

      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Global APK
        run: flutter build apk --release
        
      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi
        
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-releases
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Generate Changelog
        id: changelog
        run: |
          CHANGELOG=$(python3 tools/gen_changelog.py "${{ steps.version.outputs.display }}")
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.body }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
